name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create temporary config.py (CI placeholder)
        run: |
          echo 'MYSQL_USER="ci"' > config.py
          echo 'MYSQL_PASSWORD="ci"' >> config.py
          echo 'MYSQL_HOST="localhost"' >> config.py
          echo 'MYSQL_PORT="3306"' >> config.py
          echo 'MYSQL_DATABASE="shop_data"' >> config.py

      - name: Run tests with coverage and fail if coverage < 55%
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=55

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml